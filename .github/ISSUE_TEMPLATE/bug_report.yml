name: Bug Report
description: File a bug report to help us improve InboxOps
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: A clear and concise summary of the bug
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Desktop App (Electron/Renderer)
        - Backend API
        - Worker (email-sync)
        - Worker (extraction/AI)
        - Worker (reminders)
        - Database / Migration
        - Authentication / OAuth
        - Documentation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior
      placeholder: |
        1. Ingest email with subject 'RFQ-...'
        2. Open review queue
        3. Attempt to approve extracted deadline
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? (Include error messages/logs)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Environment / OS & Version
      description: e.g., Windows 11, Node v20.x, Desktop v0.1.0
    validations:
      required: false
